<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok素材制作助手</title>
    <style>
      :root {
        color: #182235;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
        background: #f7f8fb;
      }

      main {
        display: grid;
        gap: 12px;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .status {
        min-width: 88px;
        border: 1px solid #cfd6e3;
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
        color: #4d5b71;
        font-size: 12px;
        text-align: center;
      }

      section {
        display: grid;
        gap: 10px;
        border: 1px solid #d8dfeb;
        border-radius: 8px;
        background: #fff;
        padding: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #34445c;
        font-size: 13px;
        font-weight: 600;
      }

      textarea,
      input {
        width: 100%;
        min-width: 0;
        border: 1px solid #c9d1df;
        border-radius: 6px;
        padding: 9px 10px;
        background: #fff;
        color: #182235;
        font: inherit;
        font-size: 13px;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
        line-height: 1.45;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      button {
        width: fit-content;
        min-width: 112px;
        border: 1px solid #182235;
        border-radius: 6px;
        padding: 9px 12px;
        background: #182235;
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      pre {
        min-height: 92px;
        max-height: 260px;
        overflow: auto;
        margin: 0;
        border: 1px solid #d8dfeb;
        border-radius: 6px;
        padding: 10px;
        background: #f9fbfd;
        color: #29374d;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      @media (max-width: 640px) {
        body {
          padding: 10px;
        }

        header,
        .row {
          align-items: stretch;
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>TikTok素材制作助手</h1>
        <div class="status" id="status">就绪</div>
      </header>

      <section>
        <label>
          粘贴脚本
          <textarea id="script" placeholder="把完整口播脚本粘贴到这里"></textarea>
        </label>
        <div class="row">
          <label>
            商品名（可选）
            <input id="productName" placeholder="例如：Parenting Book" />
          </label>
          <label>
            补充要求（可选）
            <input id="notes" placeholder="例如：开头更强冲突、更像美区广告" />
          </label>
        </div>
        <button id="start">开始制作</button>
      </section>

      <section>
        <pre id="output">等待脚本；将先准备首段钩子预检。</pre>
      </section>
    </main>

    <script type="module">
      const statusEl = document.querySelector("#status");
      const outputEl = document.querySelector("#output");
      const scriptEl = document.querySelector("#script");
      const productNameEl = document.querySelector("#productName");
      const notesEl = document.querySelector("#notes");
      const startButton = document.querySelector("#start");
      let rpcId = 0;
      const pending = new Map();

      function rpcNotify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.id !== "number") return;
        const request = pending.get(message.id);
        if (!request) return;
        pending.delete(message.id);
        if (message.error) {
          request.reject(message.error);
          return;
        }
        request.resolve(message.result);
      });

      async function initializeBridge() {
        await rpcRequest("ui/initialize", {
          appInfo: { name: "TikTok素材制作助手", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26"
        });
        rpcNotify("ui/notifications/initialized", {});
      }

      const bridgeReady = initializeBridge().catch((error) => {
        statusEl.textContent = "离线";
        outputEl.textContent = JSON.stringify(error, null, 2);
      });

      async function startWorkflow() {
        await bridgeReady;
        const script = scriptEl.value.trim();
        if (!script) {
          outputEl.textContent = "请先粘贴脚本。";
          return;
        }
        statusEl.textContent = "制作中";
        startButton.disabled = true;
        try {
          const response = await rpcRequest("tools/call", {
            name: "start_script_workflow",
            arguments: {
              script,
              productName: productNameEl.value.trim(),
              notes: notesEl.value.trim()
            }
          });
          statusEl.textContent = "完成";
          outputEl.textContent = JSON.stringify(response.structuredContent ?? response, null, 2);
        } catch (error) {
          statusEl.textContent = "失败";
          outputEl.textContent = JSON.stringify(error, null, 2);
        } finally {
          startButton.disabled = false;
        }
      }

      startButton.addEventListener("click", startWorkflow);
    </script>
  </body>
</html>
